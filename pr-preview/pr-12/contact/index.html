<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta property="og:title" content="Contact Chas Nelson" />
    <meta
      property="og:description"
      content="Dr Chas Nelson is a data scientist and engineer focused on using data to change the world for the better."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/images/cjn.jpg" />
    <meta
      name="description"
      content="Dr Chas Nelson is a data scientist and engineer focused on using data to change the world for the better."
    />
    <base href="" />
    <title>Contact Chas Nelson</title>
    <script>
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("chasnelson-theme") === "light" ? "light" : "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Courier+Prime:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
      integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-links">
        <a class="topbar-link" href="/">About &rarr;</a>
      </div>
      <div class="brand">
        <span class="brand-diamond"></span>
        <span>Chas Nelson</span>
        <span class="brand-diamond"></span>
      </div>
      <div class="topbar-actions">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme">Nightfall</button>
      </div>
    </header>

    <div class="masthead">
      <div class="masthead-inner">
        <div class="eyebrow">Get In Touch</div>
        <h1 class="masthead-title">
          <span class="title-line">Contact</span>
          <span class="title-line title-line-bold">Me</span>
        </h1>
        <div class="masthead-rule"><span></span><span>Usually reply within 48 hours</span><span></span></div>
      </div>
    </div>

    <div class="panel form-panel">
      <div class="panel-eyebrow">Send A Message</div>
      <div class="panel-rule"></div>
      <div class="panel-body">
        <form
          id="fs-frm"
          name="simple-contact-form"
          accept-charset="utf-8"
          action="https://formspree.io/f/xqknznvg"
          method="post"
        >
          <div class="form-field">
            <label class="form-label" for="full-name">Full Name</label>
            <input class="form-input" type="text" name="name" id="full-name" required />
          </div>
          <div class="form-field">
            <label class="form-label" for="email-address">Email Address</label>
            <input class="form-input" type="email" name="_replyto" id="email-address" required />
          </div>
          <div class="form-field">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-textarea" rows="5" name="message" id="message" required></textarea>
          </div>
          <input type="hidden" name="_subject" id="email-subject" value="Contact Form Submission" />
          <button class="form-submit" type="submit">Submit</button>
        </form>
      </div>
    </div>

    <div class="contacts">
      <a class="contact-icon" href="https://github.com/ChasNelson1990" target="_blank" rel="noopener noreferrer" aria-label="GitHub"
        ><i class="fab fa-github" aria-hidden="true"></i
      ></a>
      <a class="contact-icon" href="https://linkedin.com/in/ChasNelson1990" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"
        ><i class="fab fa-linkedin" aria-hidden="true"></i
      ></a>
    </div>

    <div class="chip-row">
      <a class="chip" href="/">About Me</a>
      <a class="chip" href="/static/cjn-cv.pdf">CV</a>
      <a class="chip" href="/anjo/">Anjo</a>
    </div>

    <footer>
      <p>&copy; 2026 Chas Nelson</p>
    </footer>
    <script src="/theme.js"></script>
  </body>
</html>
