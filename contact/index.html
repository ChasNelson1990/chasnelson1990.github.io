<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta property="og:title" content="Contact Chas Nelson" />
    <meta
      property="og:description"
      content="Dr Chas Nelson is an International Data Consultant, PhD Data Scientist and Chartered Biologist focussed on using data to change the world for the better."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/contact/" />
    <meta property="og:image" content="/images/cjn.jpg" />
    <meta
      name="description"
      content="Dr Chas Nelson is an International Data Consultant, PhD Data Scientist and Chartered Biologist focussed on using data to change the world for the better."
    />
    <base href="" />
    <title>Dr Chas Nelson - International Data Consultant</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
      integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:100,700"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div class="wrap">
      <section class="profile">
        <div class="portrait">
          <a href="/"
            ><div class="spinner"></div>
            <div
              class="img"
              style="background-image: url(/images/cjn.jpg)"
            ></div
          ></a>
        </div>
        <h1 class="name">Dr <b>Chas Nelson</b></h1>
        <main class="main">
          <div class="post-content">
            <form
              id="fs-frm"
              name="simple-contact-form"
              accept-charset="utf-8"
              action="https://formspree.io/f/xqknznvg"
              method="post"
            >
              <fieldset
                id="fs-frm-inputs"
                style="
                  font-family: inherit;
                  font-size: 100%;
                  color: inherit;
                  border: none;
                  border-radius: 0;
                  display: block;
                  width: 100%;
                  padding: 0;
                  margin: 0;
                  -webkit-appearance: none;
                  -moz-appearance: none;
                "
              >
                <label
                  for="full-name"
                  style="font-size: 0.825rem; margin-bottom: 0.5rem"
                  >Full Name</label
                >
                <input
                  type="text"
                  name="name"
                  id="full-name"
                  placeholder=""
                  required=""
                  style="
                    font-family: inherit;
                    font-size: 100%;
                    color: inherit;
                    border-radius: 0;
                    display: block;
                    width: 100%;
                    margin: 0;
                    -webkit-appearance: none;
                    -moz-appearance: none;
                    box-sizing: border-box;
                    border: 1px solid rgba(0, 0, 0, 0.2);
                    background-color: rgba(255, 255, 255, 0.9);
                    padding: 0.75em 1rem;
                    margin-bottom: 1.5rem;
                  "
                />
                <label
                  for="email-address"
                  style="font-size: 0.825rem; margin-bottom: 0.5rem"
                  >Email Address</label
                >
                <input
                  type="email"
                  name="_replyto"
                  id="email-address"
                  placeholder=""
                  required=""
                  style="
                    font-family: inherit;
                    font-size: 100%;
                    color: inherit;
                    border-radius: 0;
                    display: block;
                    width: 100%;
                    margin: 0;
                    -webkit-appearance: none;
                    -moz-appearance: none;
                    box-sizing: border-box;
                    border: 1px solid rgba(0, 0, 0, 0.2);
                    background-color: rgba(255, 255, 255, 0.9);
                    padding: 0.75em 1rem;
                    margin-bottom: 1.5rem;
                  "
                />
                <label
                  for="message"
                  style="font-size: 0.825rem; margin-bottom: 0.5rem"
                  >Message</label
                >
                <textarea
                  rows="5"
                  name="message"
                  id="message"
                  placeholder=""
                  required=""
                  style="
                    font-family: inherit;
                    font-size: 100%;
                    color: inherit;
                    border-radius: 0;
                    display: block;
                    width: 100%;
                    margin: 0;
                    -webkit-appearance: none;
                    -moz-appearance: none;
                    box-sizing: border-box;
                    border: 1px solid rgba(0, 0, 0, 0.2);
                    background-color: rgba(255, 255, 255, 0.9);
                    padding: 0.75em 1rem;
                    margin-bottom: 1.5rem;
                  "
                ></textarea>
                <input
                  type="hidden"
                  name="_subject"
                  id="email-subject"
                  value="Contact Form Submission"
                />
              </fieldset>
              <input
                type="submit"
                value="Submit"
                style="
                  font-family: inherit;
                  font-size: 100%;
                  color: inherit;
                  border-radius: 0;
                  display: block;
                  margin: 0;
                  -webkit-appearance: none;
                  -moz-appearance: none;
                  box-sizing: border-box;
                  border: 1px solid rgba(0, 0, 0, 0.2);
                  background-color: rgba(255, 255, 255, 0.9);
                  padding: 0.75em 1rem;
                  margin-bottom: 1.5rem;
                  width: auto;
                  cursor: pointer;
                  -webkit-appearance: button;
                  -moz-appearance: button;
                  appearance: button;
                "
              />
            </form>
          </div>
        </main>
      </section>
      <section class="contacts">
        <a
          class="contact"
          href="https://github.com/ChasNelson1990"
          target="_blank"
          ><i class="fab fa-github" aria-hidden="true"></i
        ></a>
        <a
          class="contact"
          href="https://linkedin.com/in/ChasNelson1990"
          target="_blank"
          ><i class="fab fa-linkedin" aria-hidden="true"></i
        ></a>
      </section>
      <section class="actions">
        <a class="action" href="/">About Me</a>
        <a class="action" href="cjn-cv.pdf">CV</a>
        <a class="action" href="/anjo">Anjo</a>
      </section>
    </div>
    <footer class="footer">
      <p class="copyright">© 2023 Chas Nelson</p>
      <p class="powered-by">
        Powered by <a href="https://gohugo.io/" target="_blank">Hugo</a> &amp;
        <a
          href="https://github.com/posquit0/hugo-awesome-identity"
          target="_blank"
          >Awesome Identity</a
        >.
      </p>
    </footer>
  </body>
</html>
